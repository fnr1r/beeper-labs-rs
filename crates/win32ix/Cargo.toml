[package]
name = "win32ix"
version = "0.0.0"
edition = "2021"
#rust-version = "1.76"
rust-version = "1.82"

[target.'cfg(windows)'.dependencies]
bytemuck = { version = "1.4", features = ["derive"] }

[target.'cfg(windows)'.dependencies.windows]
version = ">=0.58, <=0.62"
#version = ">=0.58, <=0.61"
#version = "0.58"
features = [
    "Win32",
    #"Win32_Foundation",
    #"Win32_Security",
    "Win32_Storage",
    "Win32_Storage_FileSystem",
    "Win32_System",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
]

[features]
reexport_windows = []

[lints]
workspace = true
