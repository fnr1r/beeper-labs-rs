[package]
name = "btrreflink"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
cfg-if = "1"
easy-ext = "1"
tracing = { version = "0.1", optional = true }

[dependencies.controlflowtools]
path = "../controlflowtools"
default-features = false
features = ["result"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies.ctor]
version = "1"
optional = true

[target.'cfg(target_os = "windows")'.dependencies.derive_more]
version = "2"
features = ["constructor"]

[target.'cfg(target_os = "linux")'.dependencies.rustix]
version = "1"
features = ["fs"]

[target.'cfg(target_os = "macos")'.dependencies.rustix]
version = "1"
features = ["fs"]
optional = true

[target.'cfg(target_os = "windows")'.dependencies.win32ix]
path = "../win32ix"
features = ["reexport_windows"]

[features]
default = ["hax", "macos_dynlink", "macos_dynlink_eager"]

copy_fallback = []
hax = ["macos_hax"]
tracing = ["dep:tracing"]

macos_dynlink = ["dep:libc", "controlflowtools/option"]
macos_dynlink_eager = ["macos_dynlink", "dep:ctor"]
macos_hax = ["dep:libc", "dep:rustix"]
